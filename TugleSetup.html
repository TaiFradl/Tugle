<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'self' file:; img-src 'self' file:; media-src 'self' file:;">
<title>Tugle setup</title>
<style>
@font-face{font-family:TugleUI;src:url('assets/Slabo13px-Regular.ttf')}
:root{color-scheme:dark;font-family:TugleUI,'Segoe UI',sans-serif;color:#ebf0f8;background:#0b1018;--accent:#4ccdbc;--chrome:#182536;--surface:#20364f;--background:#0b1018;--text:#ebf0f8;--muted:#9aaabd;--border:#385675;--wall:linear-gradient(135deg,#071526,#203d5b)}
*{box-sizing:border-box}html,body{height:100%;margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.48;cursor:default}[hidden]{display:none!important}
.shell{height:100dvh;display:grid;grid-template-rows:76px minmax(0,1fr) 78px}header,footer{display:flex;align-items:center;padding:0 max(26px,calc((100vw - 1120px)/2));gap:20px;background:var(--chrome)}header{border-bottom:1px solid var(--border)}footer{justify-content:space-between;border-top:1px solid var(--border)}.brand{display:flex;align-items:center;gap:10px;font-size:25px}.brand img{width:32px;height:32px}.progress{display:flex;align-items:center;gap:19px;margin-left:auto}.progress span{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px}.progress i{display:grid;place-items:center;width:24px;height:24px;border:1px solid var(--border);border-radius:50%;font:12px 'Segoe UI',sans-serif;font-style:normal}.progress .active{color:var(--text)}.progress .active i,.progress .complete i{background:var(--accent);border-color:var(--accent);color:#0b1018}.close{width:38px;height:38px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:26px 'Segoe UI',sans-serif}.close:hover{background:var(--surface);color:var(--text)}
main{overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 28px;gap:24px}h1{margin:0;font-size:clamp(28px,2.5vw,36px);font-weight:400}#page{width:100%;max-width:1020px}.account{min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}.app-logo{width:118px;height:118px;object-fit:contain}.status{min-height:20px;margin:0;color:var(--muted);font:14px 'Segoe UI',sans-serif;text-align:center}.action{min-height:50px;padding:10px 20px;background:var(--surface);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:16px}.action:hover{border-color:var(--accent)}#google{min-width:230px}.primary,.secondary{min-width:112px;min-height:48px;padding:10px 22px;border-radius:8px;font-size:16px}.primary{background:var(--accent);border:1px solid var(--accent);color:#0b1018}.secondary{background:transparent;border:1px solid var(--border);color:var(--muted)}.secondary:hover{background:var(--surface)}
.choice-page{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(330px,.9fr);gap:44px;align-items:center}.preview{width:100%;overflow:hidden;border:1px solid var(--border);border-radius:14px;background:var(--chrome)}.bar{height:25px;padding:9px 12px;display:flex;gap:5px}.bar i{width:5px;height:5px;border-radius:50%;background:var(--muted)}.address{height:18px;margin:0 10px 10px;border-radius:5px;background:var(--surface)}.preview-page{position:relative;height:266px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;background:var(--wall)}.preview-icon,.preview-logo,.search,.recent{position:relative;z-index:1}.preview-icon{width:55px;height:55px;object-fit:contain}.preview-logo{color:#fff;font-size:27px;letter-spacing:.16em;text-shadow:0 2px 8px #0008}.search{width:64%;height:34px;display:flex;align-items:center;padding:0 13px;border:1px solid var(--border);border-radius:19px;background:var(--surface);color:var(--muted);font:12px 'Segoe UI',sans-serif}.recent{display:flex;gap:7px;width:64%}.recent i{height:24px;flex:1;border:1px solid #ffffff24;border-radius:5px;background:#ffffff1a}.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.controls{display:flex;flex-direction:column;gap:16px}.section-label{margin:0;color:var(--muted);font:14px 'Segoe UI',sans-serif}.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.theme{display:flex;align-items:center;gap:10px;min-height:47px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--chrome);color:var(--text);text-align:left;font-size:14px}.theme i{width:18px;height:18px;flex:0 0 18px;border-radius:50%;background:var(--swatch)}.theme[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.theme[aria-pressed=true] i{box-shadow:0 0 0 2px var(--chrome),0 0 0 3px var(--accent)}.custom-theme{width:100%;font-size:15px}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border:1px solid var(--border);border-radius:10px;background:var(--background)}.mode{min-height:40px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:14px}.mode[aria-pressed=true]{background:var(--surface);color:var(--text)}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.preset{height:58px;border:1px solid var(--border);border-radius:8px;background:var(--tile);color:transparent}.preset[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.options{display:flex;gap:8px}.options>.action{flex:1;font-size:14px}.upload{width:100%;min-height:148px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;border:1px dashed var(--border);background:var(--background)}.upload:hover{border-color:var(--accent)}.upload svg{width:29px;height:29px;stroke:var(--accent)}.filename{min-height:18px;color:var(--muted);font:13px 'Segoe UI',sans-serif;text-align:center;overflow-wrap:anywhere}
@media(max-width:820px){.choice-page{max-width:540px;grid-template-columns:1fr;gap:22px}.preview-page{height:178px}.preview-icon{width:42px;height:42px}.preview-logo{font-size:23px}.progress{gap:8px}.progress span{font-size:0}.progress span i{font-size:12px}}@media(max-width:540px){.shell{grid-template-rows:68px minmax(0,1fr) 70px}header,footer{padding:0 16px}.brand{font-size:21px}.brand img{width:28px;height:28px}.close{width:34px}main{padding:22px 18px}.themes{grid-template-columns:repeat(2,1fr)}.preset{height:48px}}
</style>
</head>
<body>
<div class="shell"><header><span class="brand"><img src="assets/tugle-icon.png" alt="">tugle</span><nav class="progress" aria-label="Setup progress"></nav><button class="close" id="close" aria-label="Close">×</button></header><main><h1 id="heading" tabindex="-1"></h1><div id="page"></div></main><footer><button class="secondary" id="back">Back</button><button class="primary" id="next">Skip</button></footer></div>
<script>
let themes=[],customTheme=null,step=0,theme='Ocean',connected=false,signingIn=false,accountMessage='',mode='gradient';
const choices={solid:{mode:'solid',primary:'#0B1018',secondary:'#0B1018'},gradient:{mode:'gradient',primary:'#071526',secondary:'#203D5B'},image:{mode:'image',primary:'#0B1018',secondary:'#0B1018',url:null,name:'',loaded:false},video:{mode:'video',primary:'#0B1018',secondary:'#0B1018',url:null,name:'',loaded:false}};
const backgrounds={solid:[['Midnight','#0B1018'],['Slate','#263448'],['Pine','#133C35'],['Plum','#352440'],['Clay','#4A332B'],['Ink','#151527']],gradient:[['Ocean','#071526','#203D5B'],['Aurora','#102C30','#438579'],['Dusk','#271B41','#966687'],['Ember','#351F28','#AE6F4F'],['Glacier','#142F49','#528EA1'],['Moss','#1A2D24','#78855A']]};
const send=data=>window.chrome?.webview?.postMessage(data);document.querySelector('#close').onclick=()=>send({action:'close'});
const getTheme=()=>theme==='Custom'?customTheme:themes.find(t=>t.name===theme);
function applyPalette(){const t=getTheme();if(t)for(const key of ['accent','chrome','surface','background','text','muted','border'])document.documentElement.style.setProperty('--'+key,t[key]);}
function nextState(){document.querySelector('#next').disabled=step===2&&(mode==='image'||mode==='video')&&!choices[mode].loaded;}
function preview(){applyPalette();const b=choices[mode];document.documentElement.style.setProperty('--wall',mode==='gradient'?`linear-gradient(135deg,${b.primary},${b.secondary})`:b.primary);const host=document.querySelector('.preview-page');if(!host)return;host.querySelectorAll('.media').forEach(e=>{if(e.tagName==='VIDEO')e.pause();e.remove()});if((mode==='image'||mode==='video')&&b.url){const media=document.createElement(mode==='image'?'img':'video');media.className='media';if(mode==='image')media.alt='';else{media.muted=true;media.autoplay=true;media.loop=true;media.playsInline=true}media.addEventListener(mode==='image'?'load':'loadeddata',()=>{b.loaded=true;nextState()});media.onerror=()=>{b.loaded=false;nextState()};media.src=b.url;host.prepend(media)}nextState();}
const previewHtml='<div class="preview" aria-label="Tugle home preview"><div class="bar"><i></i><i></i><i></i></div><div class="address"></div><div class="preview-page"><img class="preview-icon" src="assets/tugle-icon.png" alt=""><div class="preview-logo">TUGLE</div><div class="search">Search the web</div><div class="recent"><i></i><i></i><i></i></div></div></div>';
function colorButton(text,target,color){const b=document.createElement('button');b.className='action';b.textContent=text;b.onclick=()=>send({action:'pickColor',target,color});return b;}
function render(focus=true){const labels=['Google','Theme','Background'];document.querySelector('#heading').textContent=labels[step];document.querySelector('.progress').innerHTML=labels.map((label,i)=>`<span class="${i===step?'active':i<step?'complete':''}"><i>${i<step?'✓':i+1}</i>${label}</span>`).join('');document.querySelector('.progress').setAttribute('aria-label',`Step ${step+1} of 3`);const page=document.querySelector('#page');page.className='';page.innerHTML='';
if(step===0){page.innerHTML='<div class="account"><img class="app-logo" src="assets/tugle-icon.png" alt="Tugle"><button class="action" id="google">'+(connected?'Signed in':'Sign in with Google')+'</button><p class="status" id="accountStatus"></p></div>';const google=page.querySelector('#google');google.disabled=connected||signingIn;page.querySelector('#accountStatus').textContent=accountMessage;google.onclick=()=>{signingIn=true;accountMessage='Google opened in your browser';render(false);send({action:'google'})}}
if(step===1){page.className='choice-page';page.innerHTML=previewHtml+'<section class="controls" aria-label="Theme"><p class="section-label">Choose a color</p><div class="themes" role="group" aria-label="Theme colors"></div><button class="action custom-theme" id="customTheme">Custom color</button></section>';const grid=page.querySelector('.themes');themes.forEach(t=>{const b=document.createElement('button');b.className='theme';b.setAttribute('aria-pressed',t.name===theme);b.style.setProperty('--swatch',t.accent);b.innerHTML='<i></i><span>'+t.name+'</span>';b.onclick=()=>{theme=t.name;send({action:'theme',name:theme});render(false)};grid.append(b)});page.querySelector('#customTheme').onclick=()=>send({action:'pickTheme'});}
if(step===2){page.className='choice-page';page.innerHTML=previewHtml+'<section class="controls" aria-label="Background"><div class="modes" role="group" aria-label="Background type"><button class="mode" data-mode="solid">Color</button><button class="mode" data-mode="gradient">Gradient</button><button class="mode" data-mode="image">Picture</button><button class="mode" data-mode="video">Video</button></div><div id="backgroundChoices"></div><div class="options"></div><div class="filename" id="fileName"></div><p class="status" id="mediaStatus"></p></section>';page.querySelectorAll('.mode').forEach(button=>{button.setAttribute('aria-pressed',button.dataset.mode===mode);button.onclick=()=>{mode=button.dataset.mode;render(false)}});const options=page.querySelector('.options'),b=choices[mode],presets=page.querySelector('#backgroundChoices');if(mode==='solid'||mode==='gradient'){presets.className='presets';backgrounds[mode].forEach(([name,primary,secondary=primary])=>{const tile=document.createElement('button');tile.className='preset';tile.title=name;tile.setAttribute('aria-label',name);tile.setAttribute('aria-pressed',b.primary.toLowerCase()===primary.toLowerCase()&&b.secondary.toLowerCase()===secondary.toLowerCase());tile.style.setProperty('--tile',mode==='gradient'?`linear-gradient(135deg,${primary},${secondary})`:primary);tile.onclick=()=>{b.primary=primary;b.secondary=secondary;render(false)};presets.append(tile)});if(mode==='solid')options.append(colorButton('Custom color','primary',b.primary));else options.append(colorButton('Start','primary',b.primary),colorButton('End','secondary',b.secondary))}else{const choose=document.createElement('button');choose.className='action upload';choose.innerHTML='<svg viewBox="0 0 32 32" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+(mode==='image'?'<rect x="4" y="5" width="24" height="22" rx="4"/><circle cx="11" cy="12" r="2"/><path d="m5 24 8-8 5 5 4-4 5 6"/>':'<rect x="3" y="7" width="18" height="18" rx="4"/><path d="m21 13 8-5v16l-8-5"/>')+'</svg><span>'+(b.url?'Change ':'Choose ')+(mode==='image'?'picture':'video')+'</span>';choose.onclick=()=>send({action:'pickMedia',mode});presets.append(choose);page.querySelector('#fileName').textContent=b.name;options.hidden=true}}
document.querySelector('#back').style.visibility=step===0?'hidden':'visible';document.querySelector('#next').textContent=step===0?(connected?'Next':'Skip'):step===1?'Next':'Done';nextState();if(focus)document.querySelector('#heading').focus();preview();}
document.querySelector('#back').onclick=()=>{if(step>0){step--;render()}};document.querySelector('#next').onclick=()=>{if(step<2){step++;render()}else{document.querySelector('#next').disabled=true;send({action:'finish',theme,background:choices[mode]})}};render(false);send({action:'ready'});
window.chrome?.webview?.addEventListener('message',e=>{const d=e.data;if(d.type==='themes'){themes=d.themes;customTheme=d.custom;theme=d.selected;render(false)}if(d.type==='customTheme'){customTheme=d.theme;theme='Custom';render(false)}if(d.type==='color'){choices[mode][d.target]=d.color;if(mode==='solid')choices[mode].secondary=d.color;render(false)}if(d.type==='media'){choices[d.mode]={...choices[d.mode],url:d.url,name:d.name,loaded:false};mode=d.mode;render(false)}if(d.type==='error'){signingIn=false;accountMessage=d.message;render(false)}if(d.type==='account'){connected=d.connected;signingIn=false;accountMessage=connected?'Signed in':d.message||'';if(connected&&step===0)step=1;render(false)}});
</script>
</body></html>
